baseURL = "https://titaniumbones.github.io/small-things-website/"
languageCode = "en-ca"
title = "Small Things"
timeZone = "America/Toronto"
enableRobotsTXT = true
buildFuture = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "A live-recorded podcast from the HISS Research Hub at the University of Toronto Scarborough. One faculty guest, one object, one conversation."
  contactEmail = "matt.price@utoronto.ca"
  hostName = "Matt Price"
  hubName = "HISS Research Hub"
  # TODO: this host did not resolve on 2026-10-05. Replace with the Hub's real address.
  hubUrl = "https://hiss.utsc.utoronto.ca"
  hcsUrl = "https://www.utsc.utoronto.ca/hcs/"
  utscUrl = "https://www.utsc.utoronto.ca"
  repoUrl = "https://github.com/titaniumbones/small-things-website"
  campusAddress = "1265 Military Trail, Toronto, ON M1C 1A4"
  recordingRoom = "KW 130"
  # Outlook ICS feed for HISS Hub events. Read by scripts/import_ics.py.
  outlookFeed = "https://outlook.office365.com/owa/calendar/440eb03d2eb1441f8a1eb982ca0bfe85@utoronto.ca/09ed34891be24022a7a03e4f01f021ba18325636079788834604/calendar.ics"
  upcomingOnHome = 3

[outputFormats.calendar]
  mediaType = "text/calendar"
  baseName = "calendar"
  isPlainText = true
  notAlternative = false

[outputFormats.eventsjson]
  mediaType = "application/json"
  baseName = "events"
  isPlainText = true

[mediaTypes."text/calendar"]
  suffixes = ["ics"]

[outputs]
  home = ["html", "calendar", "eventsjson"]
  section = ["html", "calendar"]
  page = ["html", "calendar"]

[menus]
  [[menus.main]]
    name = "About Us"
    pageRef = "/about"
    weight = 10
  [[menus.main]]
    name = "Events"
    pageRef = "/events"
    weight = 20
  [[menus.main]]
    name = "What we do"
    pageRef = "/what-we-do"
    weight = 30
  [[menus.main]]
    identifier = "contact"
    name = "Contact"
    pageRef = "/contact"
    weight = 40
