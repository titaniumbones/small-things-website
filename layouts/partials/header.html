<header class="top">
  <div class="wrap top-inner">
    {{- /* No official HISS logo yet: the .logo mark is a placeholder. Swap it for the logo file here. */}}
    <a class="wordmark" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} home"><span class="logo" aria-hidden="true"></span>{{ site.Title }}</a>
    <nav class="nav" aria-label="Main">
      {{- $current := . }}
      {{- range site.Menus.main }}
      {{- $here := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}
      <a href="{{ .URL }}"{{ if eq .Identifier "contact" }} class="nav-contact"{{ end }}{{ if $here }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
