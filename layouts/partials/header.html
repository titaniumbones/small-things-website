<header class="site-header">
  <a class="wordmark" href="{{ "/" | relURL }}" aria-label="Small Things home">
    <span class="wordmark-small">Small</span><span class="wordmark-big">Things</span>
  </a>
  <nav class="site-nav" aria-label="Main">
    {{- $current := . }}
    {{- range site.Menus.main }}
    <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
</header>
