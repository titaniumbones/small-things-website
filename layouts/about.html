{{ define "bodyclass" }}about{{ end }}
{{ define "main" }}
<section class="page-head">
  <div class="wrap">
    <p class="kicker">{{ .Params.eyebrow | default site.Title }}</p>
    <h1 class="h-xl">{{ .Title }}</h1>
    {{ with .Params.lede }}<p class="lede">{{ . }}</p>{{ end }}
  </div>
</section>
{{- range .Params.sections }}
<section class="section section-line">
  <div class="wrap two-col">
    <h2 class="h-md">{{ .label }}</h2>
    <div class="prose">{{ .body | markdownify }}</div>
  </div>
</section>
{{- end }}
{{- with .Content }}
<section class="section section-line"><div class="wrap"><div class="prose">{{ . }}</div></div></section>
{{- end }}
{{ end }}
