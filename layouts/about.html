{{ define "bodyclass" }}about{{ end }}
{{ define "main" }}
<section class="page-hero wrap">
  <p class="eyebrow">{{ .Params.eyebrow | default site.Title }}</p>
  <h1 class="display-xl">{{ .Title }}</h1>
  {{ with .Params.lede }}<p class="lede">{{ . }}</p>{{ end }}
</section>
{{- range .Params.sections }}
<section class="band">
  <div class="wrap split">
    <h2 class="eyebrow">{{ .label }}</h2>
    <div class="prose">{{ .body | markdownify }}</div>
  </div>
</section>
{{- end }}
{{- with .Content }}
<section class="band"><div class="wrap"><div class="prose">{{ . }}</div></div></section>
{{- end }}
{{ end }}
