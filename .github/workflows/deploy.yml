name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 10:00 UTC (06:00 Toronto) so HISS Hub events imported from Outlook stay fresh.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Check event files
        run: uv run scripts/check_events.py

      - name: Import HISS Hub events from Outlook
        # A feed outage should not take the site down: fall back to building without imported events.
        run: uv run scripts/import_ics.py || echo "::warning::Outlook import failed; building without HISS Hub events"

      - name: Run tests
        run: uv run --group dev pytest -q

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url || 'https://example.org' }}/"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
