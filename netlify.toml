# Netlify build for the site. Runs the same checks as the GitHub Pages workflow (.github/workflows/deploy.yml).
# Netlify sets $URL (the production address) and $DEPLOY_PRIME_URL (the address of this particular deploy).

[build]
  publish = "public"
  command = """
    python3 -m pip install --quiet uv &&
    uv run scripts/check_events.py &&
    (uv run scripts/import_ics.py || echo 'Outlook import failed; building without HISS Hub events') &&
    uv run --group dev pytest -q &&
    hugo --gc --minify --baseURL "$URL/"
  """

[build.environment]
  HUGO_VERSION = "0.152.2"

# Pull request previews and branch deploys: build for their own address and keep search engines out.
[context.deploy-preview]
  command = """
    python3 -m pip install --quiet uv &&
    uv run scripts/check_events.py &&
    (uv run scripts/import_ics.py || echo 'Outlook import failed; building without HISS Hub events') &&
    uv run --group dev pytest -q &&
    hugo --gc --minify --baseURL "$DEPLOY_PRIME_URL/"
  """
  [context.deploy-preview.environment]
    HUGO_PARAMS_NOINDEX = "true"

[context.branch-deploy]
  command = """
    python3 -m pip install --quiet uv &&
    uv run scripts/check_events.py &&
    (uv run scripts/import_ics.py || echo 'Outlook import failed; building without HISS Hub events') &&
    hugo --gc --minify --baseURL "$DEPLOY_PRIME_URL/"
  """
  [context.branch-deploy.environment]
    HUGO_PARAMS_NOINDEX = "true"
